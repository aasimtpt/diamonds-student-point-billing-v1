name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Check Python
        run: |
          python --version
          python -m py_compile billing.py

      - name: Build EXE
        run: |
          python -m PyInstaller ^
            --clean ^
            --noconfirm ^
            --onefile ^
            --windowed ^
            --name "Diamonds_Student_Point_Billing" ^
            billing.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Diamonds-Student-Point-Billing
          path: dist/Diamonds_Student_Point_Billing.exe
